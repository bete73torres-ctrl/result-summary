<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!--Resultado-->
    <div class="resultado">
      <p>Your Result</p>
      <div class="circulo">
        <h1>76</h1>
        <span>of 100</span>
      </div>
      <h2>Great</h2>
      <p class="paragrafo">
        You scored higher than 65% of the people who have taken these tests.</p>

    </div>
    <!--Resumo-->
    <div class="summary">
      <h2>Summary</h2>
      <ul>
        <li>
          <div class="item">
            <img src="./assets/images/icon-reaction.svg">
            Reaction
          </div>
          <span>
            <Strong>80</Strong> /100
          </span>
        </li>

        <li>
          <div class="item">
            <img src="./assets/images/icon-memory.svg"> Memory
          </div>
            <span>
              <strong>92</strong> /100
            </span>

          
        </li>
        <li>
          <div class="item">
            <img src="./assets/images/icon-verbal.svg">Verbal
          </div>
          <span>
            <strong>61</strong> /100
          </span>
        </li>
        <li>
          <div class="item">
            <img src="./assets/images/icon-visual.svg">
            Visual
          </div>
          <span>
            <strong>72</strong> /100
          </span>
        </li>
        
        
        
      <button>Continue</button>

    </div>

  </main>
</body>
</html>
